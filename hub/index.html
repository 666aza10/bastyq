<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aza</title>
<meta name="theme-color" content="#0B0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Строго: имя и три категории. Композицию держат пустота и линии. */
  :root{
    --void:#0B0B0C;
    --ink:#E9E7E2;
    --dim:#76736C;
    --line:#1D1D1F;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    background:var(--void);
    color:var(--ink);
    font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100svh;
    display:flex;
    justify-content:center;
    padding:max(30px,env(safe-area-inset-top)) 24px max(30px,env(safe-area-inset-bottom));
  }

  body::after{
    content:"";
    position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }

  main{position:relative; z-index:1; width:100%; max-width:34rem; display:flex; flex-direction:column}

  .name{
    font-size:.7rem; font-weight:700; letter-spacing:.44em; text-transform:uppercase;
    color:var(--dim);
  }

  nav{margin:auto 0; border-top:1px solid var(--line)}

  a.exit{
    display:grid; grid-template-columns:1fr auto; align-items:center; gap:20px;
    padding:30px 0; border-bottom:1px solid var(--line);
    text-decoration:none; color:var(--dim);
    font-size:clamp(1.45rem,6.5vw,2rem);
    font-weight:700; letter-spacing:-.035em; line-height:1.1;
    transition:color .35s var(--ease);
  }
  a.exit:hover, a.exit:focus-visible{color:var(--ink)}

  .arrow{width:24px; height:24px; flex:none; transition:transform .45s var(--ease)}
  a.exit:hover .arrow, a.exit:focus-visible .arrow{transform:translateX(8px)}

  ::selection{background:var(--ink); color:var(--void)}
  :focus-visible{outline:1px solid var(--ink); outline-offset:8px}
  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-track{background:var(--void)}
  ::-webkit-scrollbar-thumb{background:var(--line)}
</style>
</head>
<body>
<main>

  <p class="name">Aza</p>

  <nav>

    <a class="exit" href="https://t.me/bastyq_bot">
      Аналитика бизнеса
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>

    <a class="exit" href="https://t.me/vibecodingkz_bot">
      Курс Claude Code
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>

    <a class="exit" href="https://www.instagram.com/666xbmw">
      Блог
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>

  </nav>

</main>
</body>
</html>
