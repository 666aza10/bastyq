<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aza</title>
<meta name="description" content="Автоматизирую всё, до чего дотягиваюсь.">
<meta name="theme-color" content="#08080A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#08080A;
    --ink:#F4F3EF;
    --dim:#8B8A84;
    --line:#211F24;
    --beam:#9FD8FF;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    background:var(--void);
    color:var(--ink);
    font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:500;
    min-height:100svh;
    display:flex;
    justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed; inset:-30% -30% auto -30%; height:70vh; z-index:0;
    background:radial-gradient(48% 42% at 50% 40%, rgba(159,216,255,.16), transparent 70%);
    filter:blur(18px);
    animation:drift 22s var(--ease) infinite alternate;
    pointer-events:none;
  }
  @keyframes drift{
    from{transform:translate3d(-7%,0,0) scale(1)}
    to  {transform:translate3d(9%,3%,0) scale(1.14)}
  }
  @media (prefers-reduced-motion:reduce){ body::before{animation:none} }

  main{position:relative; z-index:1; width:100%; max-width:33rem; display:flex; flex-direction:column}

  .name{
    font-size:.72rem; font-weight:700; letter-spacing:.42em; text-transform:uppercase;
    color:var(--dim);
  }

  h1{
    margin-top:auto; padding:56px 0 44px;
    font-size:clamp(2.5rem,11.5vw,4.25rem);
    font-weight:800; line-height:.94; letter-spacing:-.045em;
    text-wrap:balance;
  }
  h1 em{font-style:normal; color:var(--dim)}

  nav{border-top:1px solid var(--line)}

  a.exit{
    display:grid; grid-template-columns:1fr auto; align-items:center; gap:20px;
    padding:26px 2px; border-bottom:1px solid var(--line);
    text-decoration:none; color:inherit;
    font-size:1.5rem; font-weight:700; letter-spacing:-.03em; line-height:1.1;
    position:relative; isolation:isolate;
    opacity:0; transform:translateY(14px);
    animation:rise .9s var(--ease) forwards;
  }
  a.exit:nth-of-type(1){animation-delay:.05s}
  a.exit:nth-of-type(2){animation-delay:.13s}
  a.exit:nth-of-type(3){animation-delay:.21s}
  @keyframes rise{to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ a.exit{opacity:1; transform:none; animation:none} }

  a.exit::before{
    content:""; position:absolute; inset:0 -22px; z-index:-1;
    background:linear-gradient(90deg, rgba(159,216,255,.09), transparent 78%);
    opacity:0; transition:opacity .35s var(--ease);
  }
  a.exit:hover::before,
  a.exit:focus-visible::before{opacity:1}

  .arrow{width:24px; height:24px; flex:none; color:var(--dim);
         transition:transform .4s var(--ease), color .3s var(--ease)}
  a.exit:hover .arrow,
  a.exit:focus-visible .arrow{transform:translateX(7px); color:var(--beam)}

  footer{margin-top:36px; font-size:.82rem; font-weight:300; color:var(--dim)}

  ::selection{background:var(--beam); color:var(--void)}
  :focus-visible{outline:2px solid var(--beam); outline-offset:6px; border-radius:2px}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:var(--void)}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:var(--dim)}
</style>
</head>
<body>
<main>

  <p class="name">Aza</p>

  <h1>Автоматизирую всё,<br><em>до чего дотягиваюсь.</em></h1>

  <nav>

    <a class="exit" href="https://t.me/bastyq_bot">
      Аналитика бизнеса
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>

    <a class="exit" href="https://t.me/vibecodingkz_bot">
      Курс Claude Code
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>

    <a class="exit" href="https://www.instagram.com/666xbmw">
      Блог
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>

  </nav>

  <footer>Пишите в личку, отвечаю сам</footer>

</main>
</body>
</html>
