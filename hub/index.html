<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aza</title>
<meta name="theme-color" content="#0B0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B0B0C;
    --ink:#E9E7E2;
    --dim:#76736C;
    --line:#1D1D1F;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    background:var(--void);
    color:var(--ink);
    font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100svh;
    display:flex;
    justify-content:center;
    padding:max(30px,env(safe-area-inset-top)) 24px max(30px,env(safe-area-inset-bottom));
  }

  body::after{
    content:"";
    position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }

  main{position:relative; z-index:1; width:100%; max-width:34rem; display:flex; flex-direction:column}

  /* Баннер необязателен: нет файла — картинка убирает себя, страница не ломается */
  .banner{
    display:block; width:100%; aspect-ratio:3/2; object-fit:cover;
    margin-bottom:26px; background:#121214;
  }

  .name{
    font-size:.7rem; font-weight:700; letter-spacing:.44em; text-transform:uppercase;
    color:var(--dim);
  }

  nav{margin:auto 0; border-top:1px solid var(--line)}

  a.exit{
    display:grid; grid-template-columns:1fr auto; align-items:center; gap:18px;
    padding:26px 0; border-bottom:1px solid var(--line);
    text-decoration:none; color:inherit;
    transition:opacity .35s var(--ease);
  }
  .exit b{
    display:block; color:var(--ink);
    font-size:clamp(1.32rem,5.6vw,1.7rem);
    font-weight:700; letter-spacing:-.035em; line-height:1.12;
  }
  /* Строка о боли, а не о продукте: человек узнаёт в ней себя, а не софт */
  .exit small{
    display:block; margin-top:9px; color:var(--dim);
    font-size:.95rem; font-weight:400; line-height:1.45; letter-spacing:-.005em;
  }

  .arrow{width:24px; height:24px; flex:none; color:var(--dim);
         transition:transform .45s var(--ease), color .35s var(--ease)}
  a.exit:hover .arrow, a.exit:focus-visible .arrow{transform:translateX(8px); color:var(--ink)}

  ::selection{background:var(--ink); color:var(--void)}
  :focus-visible{outline:1px solid var(--ink); outline-offset:8px}
  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-track{background:var(--void)}
  ::-webkit-scrollbar-thumb{background:var(--line)}
</style>
</head>
<body>
<main>

  <img class="banner" src="banner.jpg" alt="" onerror="this.remove()">

  <p class="name">Aza</p>

  <nav>

    <a class="exit" href="https://t.me/bastyq_bot">
      <span>
        <b>Аналитика бизнеса</b>
        <small>Касса говорит, сколько заработали. Где потеряли, не говорит.</small>
      </span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>

    <a class="exit" href="https://t.me/vibecodingkz_bot">
      <span>
        <b>Курс Claude Code</b>
        <small>Собрать себе помощника, который делает рутину за вас. Без опыта в коде.</small>
      </span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>

    <a class="exit" href="https://www.instagram.com/666xbmw">
      <span>
        <b>Блог</b>
        <small>Как это всё устроено изнутри</small>
      </span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>

  </nav>

</main>
</body>
</html>
