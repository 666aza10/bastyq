<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Важные даты</title>
<!--
  Анкета дат — одна на всех клиентов Бастыка.

  Адрес приёма (u), название магазина (n) и телефон (phone) приходят ПАРАМЕТРАМИ
  ссылки, которую подставляет бот при отправке шаблона. Намеренно не держим
  список клиентов в файле: репозиторий публичный.

  Открывается из WhatsApp, то есть почти всегда с телефона и часто на слабом
  соединении — поэтому ни одной внешней загрузки: ни шрифтов, ни библиотек.
-->
<style>
  :root{
    --фон:#f4f1ec; --карточка:#fffdfa; --текст:#2a2723; --мягкий:#7c756c;
    --акцент:#6f7f63; --акцент-тёмный:#5b6a51; --рамка:#e2dcd3; --ошибка:#b4553f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--фон); color:var(--текст);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px 14px 40px; -webkit-text-size-adjust:100%;
  }
  .обёртка{max-width:520px;margin:0 auto}
  header{text-align:center;margin:8px 0 18px}
  .магазин{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--мягкий)}
  h1{font-size:23px;line-height:1.25;margin:10px 0 8px;font-weight:600}
  .подзаголовок{color:var(--мягкий);font-size:15px;margin:0}
  .карточка{
    background:var(--карточка);border:1px solid var(--рамка);border-radius:14px;
    padding:16px 14px;margin-bottom:12px;
  }
  label{display:block;font-size:14px;color:var(--мягкий);margin-bottom:6px}
  input,select{
    width:100%;padding:13px 12px;font-size:16px;color:var(--текст);
    background:#fff;border:1px solid var(--рамка);border-radius:10px;
  }
  input:focus,select:focus{outline:2px solid var(--акцент);outline-offset:1px}
  .пара{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ещё{
    background:none;border:1px dashed var(--рамка);color:var(--мягкий);
    width:100%;padding:12px;border-radius:10px;font-size:15px;margin-bottom:14px;
  }
  button{font-family:inherit;cursor:pointer}
  .отправить{
    width:100%;padding:16px;border:0;border-radius:12px;background:var(--акцент);
    color:#fff;font-size:16px;letter-spacing:.06em;text-transform:uppercase;
  }
  .отправить:disabled{opacity:.55}
  .ошибка{color:var(--ошибка);font-size:14px;margin:10px 0 0;display:none}
  .готово{text-align:center;padding:40px 10px;display:none}
  .готово .значок{font-size:44px}
  .готово h2{font-size:21px;margin:14px 0 8px;font-weight:600}
  .готово p{color:var(--мягкий);margin:0}
  .сноска{color:var(--мягкий);font-size:13px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="обёртка">
  <div id="форма">
    <header>
      <div class="магазин" id="магазин"></div>
      <h1>Напомним о важных датах</h1>
      <p class="подзаголовок">Укажите дни рождения близких — напомним за неделю,
        чтобы вы успели с букетом.</p>
    </header>

    <div id="строки"></div>
    <button class="ещё" id="ещё" type="button">+ ещё одна дата</button>

    <button class="отправить" id="отправить" type="button">Сохранить</button>
    <p class="ошибка" id="ошибка"></p>
    <p class="сноска">Данные видит только магазин. Отписаться можно в любой момент.</p>
  </div>

  <div class="готово" id="готово">
    <div class="значок">🌸</div>
    <h2>Записали</h2>
    <p>Напомним заранее. Хорошего дня!</p>
  </div>
</div>

<script>
(function(){
  var парам = new URLSearchParams(location.search);
  var приём   = парам.get('u') || '';
  var магазин = парам.get('n') || '';
  var телефон = (парам.get('phone') || '').replace(/\D/g,'');

  document.getElementById('магазин').textContent = магазин;
  if (магазин) document.title = магазин + ' — важные даты';

  var КОГО = ['Жена','Муж','Мама','Папа','Дочь','Сын','Сестра','Брат','Бабушка',
              'Подруга','Друг','Коллега','Моя дата','Другое'];

  var строки = document.getElementById('строки');
  function добавить(первая){
    var блок = document.createElement('div');
    блок.className = 'карточка';
    var опции = КОГО.map(function(к){ return '<option>' + к + '</option>'; }).join('');
    блок.innerHTML =
      '<div class="пара">' +
        '<div><label>Кто это</label><select class="кто">' + опции + '</select></div>' +
        '<div><label>Дата</label><input class="дата" type="date"></div>' +
      '</div>';
    строки.appendChild(блок);
    if (первая) блок.querySelector('.кто').selectedIndex = 2;   // Мама — частый случай
  }
  добавить(true); добавить(false);
  document.getElementById('ещё').onclick = function(){
    if (строки.children.length < 8) добавить(false);
  };

  function собрать(){
    var из = [];
    Array.prototype.forEach.call(строки.children, function(б){
      var кто = б.querySelector('.кто').value;
      var дата = б.querySelector('.дата').value;
      if (дата) из.push({кто: кто, дата: дата});
    });
    return из;
  }

  var кнопка = document.getElementById('отправить');
  var поле_ошибки = document.getElementById('ошибка');

  кнопка.onclick = function(){
    var даты = собрать();
    поле_ошибки.style.display = 'none';
    if (!даты.length){
      поле_ошибки.textContent = 'Укажите хотя бы одну дату.';
      поле_ошибки.style.display = 'block';
      return;
    }
    if (!приём){
      поле_ошибки.textContent = 'Ссылка неполная. Откройте её из сообщения магазина.';
      поле_ошибки.style.display = 'block';
      return;
    }
    кнопка.disabled = true;
    кнопка.textContent = 'Сохраняем…';

    // text/plain — чтобы браузер не слал предварительный запрос: Apps Script
    // на него отвечает отказом, и отправка падала бы молча.
    fetch(приём, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({анкета: true, phone: телефон, даты: даты})
    }).then(function(о){ return о.text(); })
      .then(function(){
        document.getElementById('форма').style.display = 'none';
        document.getElementById('готово').style.display = 'block';
      })
      .catch(function(){
        кнопка.disabled = false;
        кнопка.textContent = 'Сохранить';
        поле_ошибки.textContent = 'Не получилось отправить. Попробуйте ещё раз.';
        поле_ошибки.style.display = 'block';
      });
  };
})();
</script>
</body>
</html>
